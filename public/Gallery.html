<!DOCTYPE html>
<html lang="en" data-current-page="gallery">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery - LA Tech Photography Club</title>
    <link rel="icon" type="image/x-icon" href="assets/fav/site/favicon.ico">
    <link rel="manifest" href="assets/fav/site/site.webmanifest">
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/site.js" defer></script>
    <script src="js/gallery.js?v=20260511-sort-timestamps" defer></script>
</head>
<body>
    <header class="site-header">
        <nav class="nav" aria-label="Main navigation">
            <a class="brand-link" href="index.html">
                <img class="brand-logo" src="assets/logos/photo-club-logo.png" alt="LA Tech Photography Club logo">
                <span>LA Tech Photography Club</span>
            </a>
            <div class="nav-links">
                <a href="index.html" data-nav="home">Home</a>
                <a href="Gallery.html" data-nav="gallery">Gallery</a>
                <a href="Events.html" data-nav="events">Events</a>
                <a href="About_Us.html" data-nav="about">About</a>
                <a href="Contact_Us.html" data-nav="contact">Contact</a>
                <button class="theme-toggle" type="button" data-theme-toggle>Theme</button>
            </div>
        </nav>
    </header>

    <main>
        <section class="page-hero gallery-hero">
            <h1 id="gallery-heading">Member gallery</h1>
            <p class="lead">See what our members have been shooting. Select any photo to see it full size.</p>
        </section>

        <section class="section gallery-section" aria-labelledby="gallery-heading">
            <p class="gallery-count" data-gallery-count role="status">Loading photos…</p>
            <div class="gallery-tools">
                <input type="search" data-gallery-search placeholder="Search by photographer or photo title" aria-label="Search gallery">
                <select data-gallery-sort aria-label="Sort gallery">
                    <option value="newest">Newest first</option>
                    <option value="oldest">Oldest first</option>
                    <option value="title">Title</option>
                    <option value="photographer">Photographer</option>
                </select>
            </div>
            <div class="gallery-grid" data-gallery-grid>
                <p class="empty-state">Loading gallery...</p>
            </div>
        </section>
    </main>

    <dialog class="lightbox" data-lightbox aria-label="Photo viewer">
        <div class="lightbox-top">
            <div aria-live="polite">
                <p class="lightbox-title" data-lightbox-title></p>
                <p class="lightbox-meta" data-lightbox-meta></p>
            </div>
            <button class="icon-button" type="button" data-lightbox-close aria-label="Close photo" autofocus><svg aria-hidden="true" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
        </div>
        <div class="lightbox-stage">
            <div class="lightbox-image" data-lightbox-image></div>
            <button class="icon-button lightbox-prev" type="button" data-lightbox-prev aria-label="Previous photo"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M20 12H5m6-6-6 6 6 6"/></svg></button>
            <button class="icon-button lightbox-next" type="button" data-lightbox-next aria-label="Next photo"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 12h15m-6-6 6 6-6 6"/></svg></button>
        </div>
        <div class="lightbox-bottom">
            <span data-lightbox-counter></span>
            <span>Use arrow keys to browse</span>
        </div>
    </dialog>

    <footer class="site-footer">
        <div class="footer-inner">
            <span>LA Tech Photography Club</span>
            <a href="Contact_Us.html">Contact us</a>
        </div>
    </footer>
</body>
</html>
